  :root{--bg:#101012;--header:#101012;--surface:#1a1a1c;--text:#f7f7f8;--muted:#99999e;--line:#2e2e32;--incoming:#29292c;--outgoing:#606064;--date:#353538;--profile:#324555;--accent:#8fc7b5}
  body.light{--bg:#b8c7d9;--header:#f8f9fb;--surface:#fff;--text:#191b1e;--muted:#656d76;--line:#cbd3dc;--incoming:#fff;--outgoing:#a3e85b;--date:#9aaabc;--profile:#455a73;--accent:#1b7c64}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#08080a;color:var(--text);font-family:ChatNoto,-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;-webkit-font-smoothing:antialiased}
  .app{width:min(100%,520px);margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 44px #0004}
  .sticky{position:sticky;top:0;z-index:5;background:var(--header);box-shadow:0 1px 0 var(--line)}
  .status{height:37px;padding:9px 25px 0;display:flex;justify-content:space-between;align-items:flex-start;font:700 14px -apple-system,BlinkMacSystemFont,Arial,sans-serif}
  .indicators{display:flex;align-items:center;gap:6px}.bars{display:flex;align-items:flex-end;gap:2px;height:12px}.bars i{background:var(--text);width:3px;border-radius:2px}.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:12px}
  .wifi{display:inline-block;width:15px;height:15px;border:2px solid var(--text);border-bottom-color:transparent;border-left-color:transparent;border-radius:50%;transform:rotate(-45deg)}.battery{display:inline-block;width:24px;height:12px;border:1.5px solid var(--text);border-radius:3px;padding:2px;position:relative}.battery:before{content:'';display:block;width:17px;height:5px;background:var(--text);border-radius:1px}.battery:after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--muted);border-radius:2px}
  .nav{height:66px;display:flex;align-items:center;gap:12px;padding:0 14px}
  button{font:inherit;cursor:pointer}
  .icon-btn{width:35px;height:40px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;padding:0;flex:none}
  .icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .peer{min-width:0;flex:1}.peer .name{font-size:19px;font-weight:700;line-height:1.2}.peer .sub{font-size:11px;color:var(--muted);margin-top:5px}
  .search-bar{display:flex;align-items:center;gap:9px;padding:7px 14px 12px;border-top:1px solid var(--line)}.search-bar[hidden]{display:none}.search-bar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 11px;font:inherit;font-size:14px}.result-count{color:var(--muted);font-size:11px;white-space:nowrap}
  .menu{position:absolute;top:94px;right:10px;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 38px #0005;padding:7px;z-index:10}.menu[hidden]{display:none}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:11px;border-radius:8px;font-size:14px}.menu button:active{background:var(--date)}
  .chat{padding:17px 12px max(105px,calc(97px + env(safe-area-inset-bottom)));min-height:calc(100dvh - 102px)}
  .date-pill{width:max-content;max-width:95%;margin:0 auto 20px;background:var(--date);padding:5px 14px;border-radius:20px;font-size:11px;color:var(--text);opacity:.82}
  .message{display:flex;align-items:flex-end;gap:6px;margin:0 0 9px;min-width:0}.message.in{justify-content:flex-start}.message.out{justify-content:flex-end}
  .avatar{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--profile);color:#f5f7fa;display:grid;place-items:center;font:700 15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;margin-bottom:3px}.avatar.blank{visibility:hidden}
  .bubble{display:block;max-width:min(74vw,315px);padding:9px 12px 10px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.8px;line-height:1.46;letter-spacing:.01em;color:var(--text)}
  .in .bubble{background:var(--incoming);border-top-left-radius:5px}.out .bubble{background:var(--outgoing);border-top-right-radius:5px}
  .time{font:11px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--muted);white-space:nowrap;margin-bottom:4px;flex:none}
  .photo-bubble{padding:0!important;overflow:hidden;border-radius:13px!important;background:transparent!important;line-height:0}
  .photo-bubble img{display:block;max-width:min(72vw,315px);width:auto;height:auto;max-height:340px;object-fit:contain;cursor:zoom-in}
  .photo-bubble img.first{width:min(62vw,270px);aspect-ratio:1;object-fit:cover}
  .message[hidden]{display:none}
  .composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);padding:10px 13px calc(20px + env(safe-area-inset-bottom));height:calc(72px + env(safe-area-inset-bottom));display:flex;align-items:flex-start;gap:13px;background:var(--surface);border-top:1px solid var(--line);z-index:4}
  .compose-icon{width:27px;height:27px;flex:none;border:2px solid var(--text);border-radius:50%;display:grid;place-items:center;font:21px Arial,sans-serif;line-height:1}.compose-image{border-radius:5px;font-size:17px}.compose-smile{font-size:22px}.compose-field{height:31px;border:1px solid var(--line);background:var(--bg);border-radius:16px;flex:1}
  .home-indicator{position:absolute;bottom:6px;left:50%;width:120px;height:4px;background:var(--text);border-radius:5px;transform:translateX(-50%);opacity:.85}
  .latest{position:fixed;z-index:4;bottom:calc(88px + env(safe-area-inset-bottom));right:max(14px,calc((100vw - 520px)/2 + 14px));background:#f1f2f4;color:#1f2125;border:0;box-shadow:0 3px 16px #0006;border-radius:20px;padding:7px 13px;font-size:12px}
  dialog{border:0;background:transparent;padding:0;max-width:96vw;max-height:96dvh;overflow:visible;color:white}dialog::backdrop{background:#000e}dialog img{display:block;max-width:92vw;max-height:86dvh;object-fit:contain;border-radius:4px}.close-photo{position:absolute;top:-36px;right:0;border:0;color:white;background:#333a;border-radius:50%;width:28px;height:28px;font-size:21px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(min-width:600px){body{padding:18px}.app{border:1px solid #333;border-radius:24px;overflow:clip}.sticky{border-radius:24px 24px 0 0}}
  @media print{body{background:white}.app{width:100%;max-width:none;box-shadow:none;background:white;color:black}.sticky,.composer,.latest,.menu{display:none!important}.chat{padding:12px;min-height:auto}.message{break-inside:avoid}.bubble{border:1px solid #aaa!important;color:black!important}.in .bubble{background:#f3f3f3}.out .bubble{background:#e0edd6}}
  </style>
</head>

<script>
(() => {
  const data=JSON.parse(document.getElementById('chatData').textContent);
  const photos=JSON.parse(document.getElementById('photoData').textContent);
  const container=document.getElementById('messages');
  const viewer=document.getElementById('viewer');
  const viewerImage=document.getElementById('viewerImage');
  let previous='';
  for(const message of data){
    const out=message.sender==='Dv';
    const row=document.createElement('article');
    row.className='message '+(out?'out':'in');
    row.dataset.text=message.text;
    const avatar=document.createElement('span');
    avatar.className='avatar'+(previous===message.sender?' blank':'');
    avatar.textContent='D';
    const bubble=document.createElement('div');
    bubble.className='bubble';
    if(message.text==='[照片]' && photos[message.time]){
      bubble.classList.add('photo-bubble');
      const img=document.createElement('img');
      img.src=photos[message.time];
      img.alt=message.time+' 傳送的照片';
      img.loading='lazy';
      if(message.time==='18:11')img.className='first';
      img.addEventListener('click',()=>{
        viewerImage.src=img.src;
        viewer.showModal();
      });
      bubble.append(img);
    }else bubble.textContent=message.text;
    const time=document.createElement('span');
    time.className='time';
    time.textContent=message.time;
    if(out)row.append(time,bubble);
    else row.append(avatar,bubble,time);
    container.append(row);
    previous=message.sender;
  }
  const menu=document.getElementById('menu');
  const searchBar=document.getElementById('searchBar');
  const searchInput=document.getElementById('searchInput');
  const resultCount=document.getElementById('resultCount');
  const rows=[...container.querySelectorAll('.message')];
  function latest(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});menu.hidden=true}
  document.getElementById('latest').addEventListener('click',latest);
  document.getElementById('scrollLatest').addEventListener('click',latest);
  document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  document.getElementById('menuToggle').addEventListener('click',()=>{menu.hidden=!menu.hidden});
  document.getElementById('searchToggle').addEventListener('click',()=>{
    searchBar.hidden=!searchBar.hidden;
    if(!searchBar.hidden)searchInput.focus();
    else{searchInput.value='';searchInput.dispatchEvent(new Event('input'))}
  });
  searchInput.addEventListener('input',()=>{
    const q=searchInput.value.trim().toLocaleLowerCase();
    let matched=0;
    for(const row of rows){
      const show=!q||row.dataset.text.toLocaleLowerCase().includes(q);
      row.hidden=!show;if(show)matched++;
    }
    resultCount.textContent=q?matched+' / '+rows.length:'';
  });
  document.getElementById('toggleTheme').addEventListener('click',(e)=>{
    const light=document.body.classList.toggle('light');
    e.currentTarget.textContent=light?'切換深色模式':'切換淺色模式';
    menu.hidden=true;
  });
  document.getElementById('copyTranscript').addEventListener('click',async()=>{
    const str='[LINE] 與Danny Ho的聊天記錄\n儲存日期：2026/10/22 19:06\n\n'+data.map(x=>x.time+'\t'+x.sender+'\t'+x.text).join('\n');
    try{await navigator.clipboard.writeText(str);alert('已複製聊天文字')}
    catch(e){const area=document.createElement('textarea');area.value=str;document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();alert(ok?'已複製聊天文字':'無法自動複製，請使用瀏覽器選取文字')}
    menu.hidden=true;
  });
  document.getElementById('closeViewer').addEventListener('click',()=>viewer.close());
  viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')menu.hidden=true});
  const latestButton=document.getElementById('latest');
  function syncLatest(){latestButton.hidden=(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-140)}
  window.addEventListener('scroll',syncLatest,{passive:true});
  window.addEventListener('resize',syncLatest);
  syncLatest();
})();
</script>
</body>
</html>
